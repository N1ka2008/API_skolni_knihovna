openapi: 3.0.3
info:
  title: School News API
  version: 1.0.0
  description: Dokumentace REST API školní knihovny.
servers:
  - url: http://localhost:8080
    description: Lokální vývoj
  - url: https://api.example.edu
    description: Staging/produkce
tags:
  - name: Kni
    description: Správa článků
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: Title is required }
    Article:
      type: object
      required: [id, title, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: Novinka z jídelny }
        body: { type: string, example: Dnes budou knedlíky... }
        createdAt: { type: string, format: date-time }
    ArticleCreate:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 3 }
        body: { type: string, minLength: 1 }
    ArticlePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Article' }
        total: { type: integer, example: 42 }
  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
      description: Index stránky (od 1)
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Počet položek na stránku
    ArticleId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: ID článku
  responses:
    BadRequest:
      description: Neplatný požadavek (validační chyba)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: VALIDATION_ERROR, message: Title is required }
    Unauthorized:
      description: Chybí nebo je neplatný přístupový token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: UNAUTHORIZED, message: Missing or invalid token }
    NotFound:
      description: Zdroj nebyl nalezen
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_FOUND, message: Article not found }
    InternalError:
      description: Neočekávaná chyba serveru
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: INTERNAL_ERROR, message: Unexpected server error }
paths: {}