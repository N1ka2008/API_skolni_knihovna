            alreadyExtended:
              summary: Výpůjčka už byla prodloužena
              value:
                code: ALREADY_EXTENDED
                message: Výpůjčka byla jednou prodloužena.
    InternalError:
      description: Neočekávaná chyba serveru.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal:
              summary: Chyba serveru
              value:
                code: INTERNAL_ERROR
                message: Neočekávaná chyba serveru.
    NoContent:
      description: Operace proběhla úspěšně a odpověď nemá tělo. Aktuální veřejné endpointy tuto odpověď nepoužívají, protože vrací JSON.

