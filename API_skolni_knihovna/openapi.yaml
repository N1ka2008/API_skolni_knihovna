              summary: Nenalezený zdroj
              value:
                code: NOT_FOUND
                message: Záznam nebyl nalezen.
    Conflict:
      description: Konflikt se stavem systému nebo knihovním pravidlem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
